name: Build & Publish

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish:
    name: Publish to NPM
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Do NOT pass registry-url: setup-node would write an
      # .npmrc with _authToken=${NODE_AUTH_TOKEN}, and a stale
      # NPM_TOKEN secret would sabotage OIDC. publishConfig.registry
      # in package.json already points to registry.npmjs.org.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # npm >= 11.5.1 is required for OIDC Trusted Publishers.
      # Use corepack to sidestep the self-upgrade MODULE_NOT_FOUND
      # bug in the bundled npm on node 22.22.2.
      - run: corepack enable
      - run: corepack prepare npm@11.5.1 --activate
      - name: Debug npm env
        run: |
          which npm
          npm --version
          node --version
          echo "ACTIONS_ID_TOKEN_REQUEST_URL is set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN is set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --loglevel verbose
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
