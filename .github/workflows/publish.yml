name: Build & Publish

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish:
    name: Publish to NPM
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # npm >= 11.5.1 is required for OIDC Trusted Publishers.
      # Use corepack instead of 'npm install -g' to sidestep the
      # self-upgrade MODULE_NOT_FOUND bug in the bundled npm on
      # node 22.22.2.
      - run: corepack enable
      - run: corepack prepare npm@11.5.1 --activate
      - run: npm ci
      - run: npm run build
      # Trusted Publisher (OIDC) — no NODE_AUTH_TOKEN. Passing an
      # empty token makes setup-node's .npmrc fall back to token
      # auth and fail with ENEEDAUTH before OIDC is tried.
      - run: npm publish --access public
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
